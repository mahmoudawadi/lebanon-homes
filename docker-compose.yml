version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lebestate_db
    environment:
      POSTGRES_USER: lebestate
      POSTGRES_PASSWORD: change-this-password
      POSTGRES_DB: lebestate_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lebestate"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lebestate_app
    environment:
      DATABASE_URL: postgresql://lebestate:change-this-password@postgres:5432/lebestate_production?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-this-secret-key
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:


